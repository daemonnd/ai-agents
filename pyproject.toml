
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_agents"
version = "1.1"
requires-python = ">=3.15.2"

dependencies = [
    "openai>=3.57.0",
    "picoagents>=0.1.1",
    "pydantic>=2.14.4",
    "rich>=15.0.0",
]

[dependency-groups]
dev = ["pytest>=9.2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["my_from_scratch_agent*"]
